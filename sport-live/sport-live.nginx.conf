    # -- sport-live (прототип live-страницы спорта для iframe партнёров) -------
    # Standalone /var/www/sport-live/index.html; данные берёт из /feed-health/ и Centrifugo.
    # X-Frame-Options НЕ ставим: страницу встраивают в iframe на чужих доменах.
    # api/wallet.php — эмуляция кошелька партнёра (балансы в /var/lib/sport-live/wallet.json).
    location = /sport-live { return 301 /sport-live/; }
    location /sport-live/ {
        alias /var/www/sport-live/;
        try_files $uri $uri/ =404;
        index index.html;
        add_header Cache-Control "no-cache" always;
        location ~ ^/sport-live/api/.+\.php$ {
            include fastcgi_params;
            fastcgi_pass unix:/var/run/php/php8.5-fpm.sock;
            fastcgi_param SCRIPT_FILENAME $request_filename;
        }
    }
