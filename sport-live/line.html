  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/main.css?v=47" />
  <link rel="stylesheet" href="assets/css/icons.css?v=2" />
  <script>
    /* тема ставится до первой отрисовки, иначе мигает тёмный фон:
       ?theme= (им пользуется витрина) → localStorage → тёмная.
       data-lum говорит, светлая тема или тёмная: по нему выбирается набор иконок,
       и «рынок» получает тот же светлый набор, что и обычная светлая тема. */
    (function () {
      var OK = { dark: 1, light: 1, classic: 1, pulse: 1, market: 1 };
      var LIGHT = { light: 1, market: 1 };
      try {
        var p = new URLSearchParams(location.search).get('theme');
        if (p && OK[p]) localStorage.setItem('sportsbook-live-theme', p);
        var t = (p && OK[p]) ? p : (localStorage.getItem('sportsbook-live-theme') || 'dark');
        if (!OK[t]) t = 'dark';
        var r = document.documentElement;
        if (t !== 'dark') r.setAttribute('data-theme', t);
        r.setAttribute('data-lum', LIGHT[t] ? 'light' : 'dark');
      } catch (e) { /* ignore */ }
    })();
  </script>
</head>

      <div id="sb-prematch"><div class="sb-skel-wrap"><div class="sb-skel sb-skel--row"></div><div class="sb-skel sb-skel--row"></div><div class="sb-skel sb-skel--row"></div></div></div>
