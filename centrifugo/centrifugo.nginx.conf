# Сниппет для server-блока nginx: WebSocket-эндпоинт Centrifugo для раздачи кэфов.
# Наружу выводится ТОЛЬКО /connection/* (клиентские транспорты). HTTP API (/api),
# админка и /metrics остаются на 127.0.0.1:8000 и доступны лишь с сервера.
# На *10 — блок gem.x1b.site в /etc/nginx/sites-enabled/borlette-test.
# Клиент подключается к wss://gem.x1b.site/centrifugo/connection/websocket

    # -- centrifugo (WS-дельты кэфов из feed-mysql-bridge) ----------
    location /centrifugo/connection/ {
        proxy_pass http://127.0.0.1:8000/connection/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
