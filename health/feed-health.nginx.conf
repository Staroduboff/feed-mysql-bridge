# Сниппет для server-блока nginx: страница здоровья feed-mysql-bridge.
# Вставить внутрь нужного `server { ... }` (на *10 — блок gem.x1b.site в
# /etc/nginx/sites-enabled/borlette-test, рядом с /ch-mem/), затем
# `nginx -t && systemctl reload nginx`. Каталог наполняет health/collect.py.

    # -- feed-health (health-check витрина feed-mysql-bridge) ----------
    # Standalone /var/www/feed-health/{index.html,data.json}, обновляется
    # каждую минуту кроном /etc/cron.d/feed-health (health/collect.py).
    location = /feed-health { return 301 /feed-health/; }
    location /feed-health/ {
        alias /var/www/feed-health/;
        try_files $uri $uri/ =404;
        index index.html;
        add_header Cache-Control "no-cache" always;
    }
